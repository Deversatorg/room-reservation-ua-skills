name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17.2
        env:
          POSTGRES_DB: roomly_test
          POSTGRES_USER: roomly
          POSTGRES_PASSWORD: roomly
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U roomly -d roomly_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql://roomly:roomly@127.0.0.1:5432/roomly_test?schema=public
      DATABASE_URL: postgresql://roomly:roomly@127.0.0.1:5432/roomly_test?schema=public
      DIRECT_DATABASE_URL: postgresql://roomly:roomly@127.0.0.1:5432/roomly_test?schema=public
      EMAIL_VERIFICATION_MODE: log
      NOTIFY_BEFORE_MINUTES: 10

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run lint
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run test:browser
      - name: Upload browser test report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report
            test-results
          if-no-files-found: ignore
