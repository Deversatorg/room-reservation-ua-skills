services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: roomly
      POSTGRES_USER: roomly
      POSTGRES_PASSWORD: roomly
    ports:
      - "5432:5432"
    volumes:
      - roomly_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U roomly -d roomly"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build: .
    environment:
      DATABASE_URL: postgresql://roomly:roomly@db:5432/roomly?schema=public
      NODE_ENV: production
    ports:
      - "3000:3000"
    depends_on:
      db:
        condition: service_healthy

volumes:
  roomly_postgres_data:
